[project]
name = "lgprune"
version = "0.1.1"
description = "Report, plan, apply and reclaim retention for LangGraph checkpoint databases (SQLite and Postgres) without breaking resume, interrupts or DeltaChannel threads."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "LeeGyeongPil" }]
keywords = ["langgraph", "checkpoint", "retention", "prune", "sqlite", "postgres", "vacuum"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "langgraph>=1.2.22,<2",
    "langgraph-checkpoint>=4.3.2,<5",
    "langgraph-checkpoint-sqlite>=3.1.3,<4",
]

[project.optional-dependencies]
postgres = [
    "langgraph-checkpoint-postgres>=3.2.1,<4",
    "psycopg[binary]>=3.3.9,<4",
]

[project.scripts]
lgprune = "lgprune.cli:main"

[project.urls]
Homepage = "https://github.com/LeeGyeongPil/lgprune"
Issues = "https://github.com/LeeGyeongPil/lgprune/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "langgraph-checkpoint-postgres>=3.2.1,<4",
    "psycopg[binary]>=3.3.9,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lgprune"]

[tool.hatch.build.targets.sdist]
include = ["src/lgprune", "tests", "examples", "README.md", "README.ko.md", "LICENSE"]
exclude = ["tests/pglite/node_modules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "pg: needs a Postgres server (LGPRUNE_TEST_PG_URL or the PGlite fixture in tests/pglite)",
]
filterwarnings = [
    # upstream langsmith on Python 3.14+: asyncio.iscoroutinefunction deprecation
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
]
